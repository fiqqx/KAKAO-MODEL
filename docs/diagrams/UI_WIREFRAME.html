<script>
(function(){
'use strict';
var app=document.getElementById('app'),params=new URLSearchParams(location.search),screen=params.get('screen')||'home',storageKey='kakao_wireframe_demo_history';
var resultAvailable=true,cameraActive=true;
function preview(target){target.replaceChildren(document.getElementById('tpl-preview').content.cloneNode(true));}
function toast(text){var el=document.getElementById('toast');el.textContent=text;el.classList.add('visible');setTimeout(function(){el.classList.remove('visible');},1900);}
function records(){try{return JSON.parse(localStorage.getItem(storageKey)||'[]');}catch(e){return [];}}
function putRecords(items){try{localStorage.setItem(storageKey,JSON.stringify(items.slice(0,10)));return true;}catch(e){toast('Penyimpanan browser penuh. Hapus riwayat lama.');return false;}}
function seed(){if(localStorage.getItem(storageKey)===null){putRecords([{id:'contoh-1',mode:'Unggah Gambar',time:'Contoh tanggal dan waktu'},{id:'contoh-2',mode:'Kamera Langsung',time:'Contoh tanggal dan waktu'},{id:'contoh-3',mode:'Unggah Gambar',time:'Contoh tanggal dan waktu'}]);}}
function save(){var items=records();items.unshift({id:String(Date.now()),mode:screen==='camera'?'Kamera Langsung':'Unggah Gambar',time:new Date().toLocaleString('id-ID'),total:20,counts:{no:8,half:5,full:7}});if(putRecords(items))toast('Contoh hasil tersimpan di browser.');}
function cameraButtons(){if(screen!=='camera')return;document.getElementById('start').disabled=cameraActive;document.getElementById('stop').disabled=!cameraActive;document.getElementById('camera-state').textContent=cameraActive?'Aktif':'Berhenti';}
function history(){var list=document.getElementById('history-list'),items=records();if(!items.length){var empty=document.createElement('div');empty.className='empty-history';empty.textContent='Belum ada riwayat. Mulai deteksi dari Home.';list.append(empty);return;}items.forEach(function(item){var node=document.getElementById('tpl-history-card').content.cloneNode(true);node.querySelector('.record-mode').textContent=item.mode;node.querySelector('.record-time').textContent=item.time;preview(node.querySelector('.history-thumb'));node.querySelector('.record-view').dataset.action='view';node.querySelector('.record-delete').dataset.action='delete';node.querySelector('.record-delete').dataset.id=item.id;list.append(node);});}
function render(next){screen=next;cameraActive=screen==='camera';resultAvailable=true;app.replaceChildren(document.getElementById('tpl-'+screen).content.cloneNode(true));document.querySelectorAll('[data-screen]').forEach(function(el){el.classList.toggle('active',el.dataset.screen===(screen==='history'?'history':'home'));});app.querySelectorAll('.preview').forEach(preview);if(screen==='history')history();cameraButtons();window.scrollTo(0,0);}
function download(){var svg=document.getElementById('tpl-preview').innerHTML.trim(),url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'})),a=document.createElement('a');a.href=url;a.download='wireframe_contoh_hasil.svg';a.click();setTimeout(function(){URL.revokeObjectURL(url);},500);}
document.addEventListener('click',function(event){var target=event.target.closest('[data-screen],[data-action]');if(!target)return;event.preventDefault();if(target.dataset.screen){render(target.dataset.screen);return;}var action=target.dataset.action;if(action==='save')save();else if(action==='download')download();else if(action==='start'){cameraActive=true;cameraButtons();toast('Simulasi kamera dimulai.');}else if(action==='stop'){cameraActive=false;cameraButtons();toast('Simulasi kamera dihentikan.');}else if(action==='choose'){toast('Wireframe area pemilihan gambar.');}else if(action==='detect'){document.getElementById('status').textContent='Simulasi sedang mendeteksi…';setTimeout(function(){if(screen!=='upload')return;document.getElementById('status').textContent='Contoh hasil · tersimpan di riwayat browser';save();},450);}else if(action==='delete'){if(confirm('Hapus riwayat contoh ini?')){putRecords(records().filter(function(item){return item.id!==target.dataset.id;}));render('history');}}else if(action==='view'){preview(document.querySelector('#details .preview'));document.getElementById('details').showModal();}else if(action==='close-dialog'){document.getElementById('details').close();}});
seed();if(!['home','upload','camera','history'].includes(screen))screen='home';render(screen);
})();
</script>
</body></html>
